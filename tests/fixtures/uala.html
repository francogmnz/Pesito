 por usuarios que el mismo día hayan realizado un viaje mediante la aplicación “Cabify” (la “Aplicación”) finalizado entre las 7:00hs y las 8:59hs, en aquellas ciudades y/o provincias del territorio de la República Argentina en donde se encuentre operativa la Aplicación. \nDurante el Plazo de Vigencia, los tarjetahabientes titulares de tarjetas de crédito, y/o Prepaga de la marca “Mastercard” emitidas por Ualá Bank S.A.U., CUIT 30-71565463-2, con domicilio en Coronel Marcelino Freyre 3650, CABA, Argentina (“Ualá”) (la/s “Tarjeta/s”) que utilicen una Tarjeta asociada a la Aplicación para abonar un viaje finalizado entre las 7:00hs y las 8:59hs de los días lunes a viernes dentro del Plazo de Vigencia (el/los “Usuario/s”), recibirán un voucher a través de una notificación personalizada que contendrá un código de descuento único e intransferible, que deberá ser cargado manualmente por el Usuario para su utilización (el “Beneficio”) y  que únicamente podrá ser aplicado el mismo día hasta las 23:59hs respecto de un viaje solicitado a través de la Aplicación (en “Próximo Viaje”). El Beneficio otorgará un descuento equivalente al 100% (cien por ciento) del precio del Próximo Viaje, por hasta un importe de ARS 25.000 (veinticinco mil pesos argentinos). Tendrá validez de uso únicamente durante el mismo día de su recepción, de lo contrario no podrán ser utilizados\nLos Usuarios deberán utilizar la misma cuenta en la Aplicación y una Tarjeta como medio de pago. El Usuario recibirá un máximo de 2 (dos) vouchers por Usuario durante el Plazo de Vigencia. \nEl Beneficio podrá aplicarse a cualquier destino, siempre que el Próximo Viaje sea solicitado dentro del horario previsto para su utilización. El Beneficio será aplicado como descuento directo sobre el precio final del viaje antes de la confirmación del mismo en la Aplicación. El Beneficio aplicará exclusivamente respecto de trayectos realizados en las siguientes categorías “Cabify”: “Cuanto Antes”, “Prioritario”, “Promo”, “Taxi” y “Cabify Mujer”. El Beneficio es acumulable con promociones bancarias, pero no combinable con otros códigos promocionales. El descuento se verá reflejado en el precio final antes de solicitar el servicio.\n\nPromoción no válida para pagos realizados mediante código QR ni acumulable con otras promociones y/o beneficios vigentes. Cabify es el exclusivo responsable por la prestación, correcto funcionamiento y/o garantía del producto y/o servicio adquirido, y cualquier reclamo deberá dirigirse contra ellos. Para más información se deberá consultar en el chat de la aplicación móvil Ualá ingresando desde el perfil del usuario en la sección “ayuda”. La Tarjeta de Crédito y/o Tarjeta Prepaga es ofrecida por Ualá, entidad financiera debidamente autorizada por el BCRA y se encuentra sujeta a condición crediticia. Para más información y condiciones o limitaciones aplicables, consulte en www.uala.com.ar/promociones. \n"}}], "componentName": "PromoCard", "promotionLogoDark": {"metadata": {"tags": [{"sys": {"type": "Link", "linkType": "Tag", "id": "arPromociones"}}], "concepts": []}, "sys": {"space": {"sys": {"type": "Link", "linkType": "Space", "id": "6n252fx9hkkr"}}, "id": "33Ntxgf5iCLD4D37IVlNRj", "type": "Asset", "createdAt": "2026-06-30T14:16:36.929Z", "updatedAt": "2026-06-30T14:16:36.929Z", "environment": {"sys": {"id": "master", "type": "Link", "linkType": "Environment"}}, "publishedVersion": 6, "revision": 1, "locale": "en-US"}, "fields": {"title": "logo_Cabify+MC_darkmode", "description": "logo_Cabify+MC_darkmode", "file": {"url": "//images.ctfassets.net/6n252fx9hkkr/33Ntxgf5iCLD4D37IVlNRj/26eed99eb6b66df88cf73295c9276361/logo_Cabify_MC_darkmode.png", "details": {"size": 44428, "image": {"width": 1400, "height": 640}}, "fileName": "logo_Cabify+MC_darkmode.png", "contentType": "image/png"}}}, "promotionType": ["Descuento"], "mobileLabel": ["Descuento"], "mobileDetail": "100%", "mobileExtra": "en dos viajes", "mobileDate": ["Lunes", "Martes", "Miércoles", "Jueves", "Vi
